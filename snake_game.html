<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>貪吃蛇遊戲</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;

    background: #1b1b1b;
    color: white;

    font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    overscroll-behavior: none;
}

.game {
    width: min(95vw, 500px);
    text-align: center;
    padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    position: relative;
}

h1 {
    margin: 10px 0;
}

.info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;

    font-size: 17px;

    margin-bottom: 10px;
}


canvas {

    display: block;
    width: 100%;
    max-width: 400px;

    aspect-ratio: 1 / 1;

    background: #101010;

    border: 3px solid #666;

    touch-action: none;
}

.sound {
    width: 44px;
    height: 40px;
    margin: 0;
    flex: 0 0 auto;
    border: none;
    border-radius: 10px;
    background: #444;
    color: white;
    font-size: 20px;
    touch-action: manipulation;
    cursor: pointer;
}

.sound:active {
    background: #777;
}

.message {
    min-height: 35px;

    margin: 10px;

    font-size: 18px;
}

.controls {
    margin-top: 10px;
}

button {
    width: 65px;
    height: 55px;

    margin: 4px;

    border: none;
    border-radius: 12px;

    background: #444;
    color: white;

    font-size: 26px;

    touch-action: manipulation;
}

button:active {
    background: #777;
}

button {
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    cursor: pointer;
}

.pauseBtn {
    width: 88px;
    height: 40px;
    margin: 0 4px;
    border-radius: 10px;
    background: #444;
    color: white;
    font-size: 16px;
    touch-action: manipulation;
}

.restart {
    width: 150px;

    font-size: 18px;

    margin-top: 10px;
}

.legend {
    margin-top: 12px;

    font-size: 14px;

    color: #ccc;

    line-height: 1.7;
}

@media (max-width: 380px) {
    .info {
        flex-wrap: wrap;
        row-gap: 6px;
        font-size: 14px;
    }
}

@media (orientation: landscape) and (max-height: 480px) {
    .game {
        max-width: 720px;
    }
    canvas {
        max-width: calc(100dvh - 200px);
    }
}

</style>

</head>


<body>

<div class="game">

<h1>貪吃蛇</h1>


<div class="info">

<button
    class="sound"
    id="soundBtn"
    aria-label="靜音切換"
    onclick="toggleMute()">

🔊

</button>

<div>
分數：
<span id="score">0</span>
</div>

<div>
最高：
<span id="high">0</span>
</div>

<div>
關卡：
<span id="level">1</span>
</div>

<button
    class="pauseBtn"
    id="pauseBtn"
    onclick="togglePause()">

⏸ 暫停

</button>

</div>


<canvas
    id="gameCanvas"
    width="400"
    height="400">
</canvas>


<div
    class="message"
    id="message">

按方向鍵開始遊戲

</div>


<div class="controls">

<div>

<button
    onclick="changeDirection('up')">

↑

</button>

</div>


<div>

<button
    onclick="changeDirection('left')">

←

</button>

<button
    onclick="changeDirection('down')">

↓

</button>

<button
    onclick="changeDirection('right')">

→

</button>

</div>


<button
    class="restart"
    onclick="restartGame()">

重新開始

</button>

</div>


<div class="legend">

普通食物：+1 分、增加 1 節<br>

特殊食物：+5 分、增加 1 節（第 10 關起）<br>

總共 397 顆食物，填滿 20×20 場域即獲勝 🏆<br>

穿牆：蛇頭出邊界時從對邊出現<br>

控制：⬅⬆⬇➡ 移動｜Space 暫停｜ENTER 重新開始｜🔊 靜音<br>

最高分會自動記錄在本機<br>

</div>

</div>


<script>

/* ==========================================
   遊戲基本設定
========================================== */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


const gridSize = 20;

const tileCount =
    canvas.width / gridSize;


/* ==========================================
   速度設定

   第 1～5 關
   0.005

   第 6～10 關
   0.010

   第 11～15 關
   0.015

   每 5 關增加 0.005
========================================== */

const START_SPEED = 0.005;

const SPEED_INCREMENT = 0.005;

const INITIAL_SNAKE_LENGTH = 3;


/* ==========================================
   實際移動時間

   數字越小
   蛇移動越快

   這裡直接控制遊戲速度。
========================================== */

const START_INTERVAL = 500;


/*
總食物數 = 填滿制

20 x 20 = 400 格
初始蛇長 3 節
總共 397 顆
= 蛇把整個場域填滿即獲勝
*/

const BOARD_CELLS =
    tileCount * tileCount;

const TOTAL_FOOD =
    BOARD_CELLS - INITIAL_SNAKE_LENGTH;


/*
收尾模式

最後 3 關

場上只保留 1 顆食物
並靠近蛇頭前方產生
方便蛇的路線
*/

const FINAL_LEVEL =
    Math.max(
        2,
        Math.floor(
            TOTAL_FOOD / 5
        ) - 2
    );


/*
每提升一級速度，

蛇每次移動減少的時間。

例如：

0.005 → 500 ms
0.010 → 475 ms
0.015 → 450 ms
0.020 → 425 ms
0.025 → 400 ms

如果你之後覺得太快，
只要調整這兩個數字即可。
*/

const INTERVAL_DECREASE = 25;


/* ==========================================
   遊戲變數
========================================== */

let snake;

let foods;

let direction;

let nextDirection;

let score;

let level;

let levelFood;

let foodsRemaining;

let gameStarted;

let gameOver;

let victory;

let gameLoop;

let paused;

let muted;

let highScore;


/* ==========================================
   計算目前速度
========================================== */

function getSpeed() {

    return (
        START_SPEED +
        Math.floor(
            (level - 1) / 5
        ) * SPEED_INCREMENT
    );

}


/* ==========================================
   計算實際移動時間
========================================== */

function getInterval() {

    const levelGroup =
        Math.floor(
            (level - 1) / 5
        );


    return Math.max(

        100,

        START_INTERVAL -
        levelGroup *
        INTERVAL_DECREASE

    );

}


/* ==========================================
   重新開始
========================================== */

function restartGame() {

    clearInterval(gameLoop);


    snake = [

        {
            x: 10,
            y: 10
        },

        {
            x: 9,
            y: 10
        },

        {
            x: 8,
            y: 10
        }

    ];


    direction = "right";

    nextDirection = "right";


    score = 0;

    level = 1;

    levelFood = 0;

    foodsRemaining =
        TOTAL_FOOD;


    gameStarted = false;

    gameOver = false;

    victory = false;

    paused = false;

    setPauseBtn(
        false
    );


    foods = [];


    createNormalFood();


    updateInfo();


    document.getElementById(
        "message"
    ).textContent =
        "按方向鍵開始遊戲";


    draw();

}


/* ==========================================
   更新畫面資訊
========================================== */

function updateInfo() {

    const scoreEl =
        document.getElementById("score");

    const highEl =
        document.getElementById("high");

    const levelEl =
        document.getElementById("level");

    if (scoreEl) {

        scoreEl.textContent =
            score;

    }

    if (highEl) {

        highEl.textContent =
            highScore;

    }

    if (levelEl) {

        levelEl.textContent =
            level;

    }

}


/* ==========================================
   產生隨機位置
========================================== */

function randomPosition() {

    return Math.floor(
        Math.random() * tileCount
    );

}


/* ==========================================
   判斷位置是否在蛇身上
========================================== */

function isOnSnake(
    x,
    y
) {

    return snake.some(

        part =>
            part.x === x &&
            part.y === y

    );

}


/* ==========================================
   判斷位置是否已有食物
========================================== */

function isOnFood(
    x,
    y
) {

    return foods.some(

        food =>
            food.x === x &&
            food.y === y

    );

}


/* ==========================================
   在指定位置建立普通食物

   收尾模式
   用來把食物放在
   蛇頭前方
 ========================================== */

function createNormalFoodAt(
    x,
    y
) {

    foods.push({

        x: x,

        y: y,

        type: "normal"

    });

}


/* ==========================================
   判斷目前是第幾關
   （收尾模式用）
 ========================================== */

function isFinalPhase() {

    return level >= FINAL_LEVEL;

}


/* ==========================================
   找蛇頭前方的最近空位
 ========================================== */

function findSpotAhead() {

    const head =
        snake[0];


    const order = [

        {
            x: 1,
            y: 0
        },

        {
            x: -1,
            y: 0
        },

        {
            x: 0,
            y: 1
        },

        {
            x: 0,
            y: -1
        },

        {
            x: 2,
            y: 0
        },

        {
            x: -2,
            y: 0
        },

        {
            x: 0,
            y: 2
        },

        {
            x: 0,
            y: -2
        }

    ];


    for (
        let r = 0;
        r < order.length;
        r++
    ) {

        const x =
            head.x +
            order[r].x;

        const y =
            head.y +
            order[r].y;


        if (

            x < 0 ||
            y < 0 ||
            x >= tileCount ||
            y >= tileCount

        ) {

            continue;

        }


        if (

            !isOnSnake(x, y) &&
            !isOnFood(x, y)

        ) {

            return {
                x: x,
                y: y
            };

        }

    }


    return null;

}


/* ==========================================
   補一個普通食物

   收尾模式
   場上只保留 1 顆
   放到蛇頭前方

   一般模式
   隨機位置
 ========================================== */

function createNormalFood() {

    if (
        isFinalPhase()
    ) {

        /*
        收尾模式
        新食物盡量放在蛇頭前方，
        找得到就放；找不到再退回隨機位置。

        刻意**不**清空場上已有的食物，
        保留填滿制的食物不變式
        （每一顆都能被吃到 → 蛇最終恰好 400 節）。
        */

        const spot =
            findSpotAhead();


        if (
            spot
        ) {

            createNormalFoodAt(
                spot.x,
                spot.y
            );

            return;

        }

    }


    let x;

    let y;

    let found = false;

    for (
        let a = 0;
        a < tileCount * tileCount
            &&
            !found;
        a++
    ) {

        x = randomPosition();

        y = randomPosition();

        found =
            !isOnSnake(x, y) &&
            !isOnFood(x, y);

    }


    if (
        !found
    ) {

        return;

    }


    foods.push({

        x: x,

        y: y,

        type: "normal"

    });

}


/* ==========================================
   建立特殊食物
========================================== */

function createSpecialFood() {

    let x;

    let y;

    let found = false;

    for (
        let a = 0;
        a < tileCount * tileCount
            &&
            !found;
        a++
    ) {

        x = randomPosition();

        y = randomPosition();

        found =
            !isOnSnake(x, y) &&
            !isOnFood(x, y);

    }


    if (
        !found
    ) {

        return;

    }


    foods.push({

        x: x,

        y: y,

        type: "special"

    });

}


/* ==========================================
   找出吃到的食物
========================================== */

function getFoodAt(
    x,
    y
) {

    return foods.findIndex(

        food =>
            food.x === x &&
            food.y === y

    );

}


/* ==========================================
   開始遊戲
========================================== */

function startGame() {

    if (
        gameStarted ||
        gameOver ||
        victory
    ) {

        return;

    }


    gameStarted = true;

    resumeAudio();


    document.getElementById(
        "message"
    ).textContent = "";


    gameLoop =
        setInterval(
            update,
            getInterval()
        );

}


/* ==========================================
   遊戲更新
========================================== */

function update() {

    direction =
        nextDirection;


    const head = {

        x: snake[0].x,

        y: snake[0].y

    };


    if (
        direction === "up"
    ) {

        head.y--;

    }


    if (
        direction === "down"
    ) {

        head.y++;

    }


    if (
        direction === "left"
    ) {

        head.x--;

    }


    if (
        direction === "right"
    ) {

        head.x++;

    }


    /* --------------------------------------
       穿牆（wrap）
       出邊界時從對邊同座標出現，不死亡
    -------------------------------------- */

    head.x =
        (head.x + tileCount) %
        tileCount;

    head.y =
        (head.y + tileCount) %
        tileCount;


    /* --------------------------------------
       撞到自己
    -------------------------------------- */

    if (

        snake.some(

            part =>
                part.x === head.x &&
                part.y === head.y

        )

    ) {

        endGame();

        return;

    }


    snake.unshift(head);


    /* --------------------------------------
       檢查食物
    -------------------------------------- */

    const foodIndex =
        getFoodAt(
            head.x,
            head.y
        );


    if (
        foodIndex !== -1
    ) {

        const food =
            foods[foodIndex];


        /* -------------------------------
           普通食物
        ------------------------------- */

        if (
            food.type === "normal"
        ) {

            score += 1;

            levelFood += 1;

            playSound("eat");

        }


        /* -------------------------------
           特殊食物
           只加分 +5，蛇長成長與普通相同（各 +1 節）
        ------------------------------- */

        if (
            food.type === "special"
        ) {

            score += 5;

            levelFood += 1;

            playSound("star");

        }


        foods.splice(
            foodIndex,
            1
        );


        /* --------------------------------
           食物遞減

           吃到最後一顆
           直接獲勝
        -------------------------------- */

        foodsRemaining--;


        if (
            foodsRemaining <= 0
        ) {

            winGame();

            return;

        }


        /* --------------------------------
           每吃 5 個食物升一關
        -------------------------------- */

        if (
            levelFood >= 5
        ) {

            level++;

            levelFood = 0;

            playSound("level");


            clearInterval(
                gameLoop
            );


            gameLoop =
                setInterval(
                    update,
                    getInterval()
                );


            /*
            第 10 關開始
            出現特殊食物

            收尾模式
            不再出現特殊食物
            */

            if (
                level >= 10 &&
                !isFinalPhase()
            ) {

                createSpecialFood();

            }


            /* --------------------------------
               進入收尾模式

               場上只保留 1 顆食物
               並靠近蛇頭前方產生
               方便蛇的路線
            -------------------------------- */

            if (
                isFinalPhase()
            ) {

                document.getElementById(
                    "message"
                ).textContent =
                    "進入第 " +
                    level +
                    " 關！收尾模式：食物會靠近蛇頭！";


                setTimeout(

                    function() {

                        if (
                            !gameOver
                        ) {

                            document.getElementById(
                                "message"
                            ).textContent =
                                "";

                        }

                    },

                    2000

                );

                return;

            }


            setTimeout(

                function() {

                    if (
                        !gameOver
                    ) {

                        document.getElementById(
                            "message"
                        ).textContent =
                            "";

                    }

                },

                1000

            );

        }


        /*
        吃完食物後
        補一個普通食物
        */

        createNormalFood();


    } else {

        /*
        沒吃到食物
        移除蛇尾
        */

        snake.pop();

    }


    updateInfo();

    draw();

}


/* ==========================================
   改變方向
========================================== */

function changeDirection(
    newDirection
) {

    if (
        gameOver ||
        victory
    ) {

        return;

    }

    if (
        paused
    ) {

        return;

    }

    resumeAudio();

    /*
    防止蛇直接 180 度轉彎
    */

    if (

        newDirection === "up" &&
        direction === "down"

    ) {

        return;

    }


    if (

        newDirection === "down" &&
        direction === "up"

    ) {

        return;

    }


    if (

        newDirection === "left" &&
        direction === "right"

    ) {

        return;

    }


    if (

        newDirection === "right" &&
        direction === "left"

    ) {

        return;

    }


    nextDirection =
        newDirection;


    startGame();

}


/* ==========================================
   暫停 / 繼續
========================================== */

function setPauseBtn(
    isPaused
) {

    const btn =
        document.getElementById(
            "pauseBtn"
        );

    if (btn) {

        btn.textContent =
            isPaused ?
            "▶ 繼續" :
            "⏸ 暫停";

    }

}

function togglePause() {

    if (
        gameOver ||
        victory
    ) {

        return;

    }

    if (
        gameStarted === false
    ) {

        return;

    }

    paused = !paused;

    setPauseBtn(
        paused
    );

    if (
        paused
    ) {

        clearInterval(
            gameLoop
        );

        document.getElementById(
            "message"
        ).textContent =
            "⏸ 已暫停（按 Space 繼續）";

    } else {

        resumeAudio();

        gameLoop =
            setInterval(
                update,
                getInterval()
            );

        document.getElementById(
            "message"
        ).textContent =
            "";

    }

}

function pauseGame() {

    if (
        paused ||
        gameOver ||
        victory ||
        gameStarted === false
    ) {

        return;

    }

    paused = true;

    setPauseBtn(
        true
    );

    clearInterval(
        gameLoop
    );

    document.getElementById(
        "message"
    ).textContent =
        "⏸ 已暫停（按 Space 繼續）";

}


/* ==========================================
   音效（Web Audio 合成，靜音可切）
========================================== */

let audioCtx = null;

function resumeAudio() {

    if (
        audioCtx &&
        audioCtx.state === "suspended"
    ) {

        audioCtx.resume();

    }

}

function getCtx() {

    if (!audioCtx) {

        const AC =
            window.AudioContext ||
            window.webkitAudioContext;

        if (AC) {

            audioCtx =
                new AC();

        }

    }

    return audioCtx;

}

function playTone(
    freq,
    start,
    dur,
    vol
) {

    const ctx = getCtx();

    if (!ctx) {

        return;

    }

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    osc.type = "sine";

    osc.frequency.value = freq;

    const t0 =
        ctx.currentTime + start;

    gain.gain.setValueAtTime(
        0.0001,
        t0
    );

    gain.gain.linearRampToValueAtTime(
        vol,
        t0 + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        t0 + dur
    );

    osc.connect(gain);

    gain.connect(
        ctx.destination
    );

    osc.start(
        t0
    );

    osc.stop(
        t0 + dur + 0.02
    );

}

function playSound(
    kind
) {

    if (muted) {

        return;

    }

    if (
        kind === "eat"
    ) {

        playTone(
            620,
            0,
            0.06,
            0.18
        );

    } else if (
        kind === "star"
    ) {

        playTone(
            880,
            0,
            0.07,
            0.22
        );

        playTone(
            1320,
            0.05,
            0.09,
            0.22
        );

    } else if (
        kind === "level"
    ) {

        playTone(
            523,
            0,
            0.09,
            0.2
        );

        playTone(
            784,
            0.06,
            0.12,
            0.2
        );

    } else if (
        kind === "over"
    ) {

        playTone(
            400,
            0,
            0.12,
            0.28
        );

        playTone(
            200,
            0.1,
            0.25,
            0.28
        );

    } else if (
        kind === "win"
    ) {

        playTone(
            523,
            0,
            0.12,
            0.22
        );

        playTone(
            659,
            0.1,
            0.12,
            0.22
        );

        playTone(
            784,
            0.2,
            0.25,
            0.24
        );

    }

}

function setMuteBtn(
    isMuted
) {

    const btn =
        document.getElementById(
            "soundBtn"
        );

    if (btn) {

        btn.textContent =
            isMuted ?
            "🔇" :
            "🔊";

    }

}

function toggleMute() {

    muted = !muted;

    try {

        localStorage.setItem(
            "snake_muted",
            muted ? "1" : "0"
        );

    } catch (e) {}

    setMuteBtn(
        muted
    );

}


/* ==========================================
   最高分（localStorage）
========================================== */

function loadHighScore() {

    let v = 0;

    try {

        v =
            parseInt(
                localStorage.getItem(
                    "snake_highscore"
                ) ||
                "0",
                10
            ) ||
            0;

    } catch (e) {}

    highScore =
        v;

}

function saveHighScore() {

    if (
        score > highScore
    ) {

        highScore =
            score;

    }

    try {

        localStorage.setItem(
            "snake_highscore",
            highScore
        );

    } catch (e) {}

}

function loadMuted() {

    let v = false;

    try {

        v =
            localStorage.getItem(
                "snake_muted"
            ) ===
            "1";

    } catch (e) {}

    muted =
        v;

}


/* ==========================================
   遊戲結束
========================================== */

function endGame() {

    gameOver = true;

    paused = false;
    setPauseBtn(false);


    clearInterval(
        gameLoop
    );

    saveHighScore();

    playSound("over");


    document.getElementById(
        "message"
    ).textContent =
        "遊戲結束！分數 " +
        score + "／最高 " +
        highScore +
        "，按 ENTER 再玩";


    updateInfo();

    draw();

}


/* ==========================================
   遊戲勝利
 ========================================== */

function winGame() {

    gameOver = true;

    victory = true;

    paused = false;
    setPauseBtn(false);


    clearInterval(
        gameLoop
    );

    const isNew = score > highScore;

    saveHighScore();

    playSound("win");


    document.getElementById(
        "message"
    ).textContent =
        "🏆 勝利！蛇填滿場域！分數 " +
        score +
        (isNew ? "，🎉 新紀錄！" : "／最高 " + highScore) +
        "，按 ENTER 再玩";


    updateInfo();

    draw();

    drawTrophy();

}


/* ==========================================
   畫獎杯
 ========================================== */

function drawTrophy() {

    const cx =
        canvas.width / 2;


    const cy = canvas.height / 2;


    ctx.save();


    /*
    半透明遮罩
    */

    ctx.fillStyle =
        "rgba(0, 0, 0, 0.65)";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
    杯身
    */

    ctx.fillStyle =
        "#ffd700";


    ctx.beginPath();


    ctx.moveTo(
        cx - 60,
        cy - 70
    );


    ctx.lineTo(
        cx + 60,
        cy - 70
    );


    ctx.quadraticCurveTo(
        cx + 60,
        cy + 10,
        cx,
        cy + 10
    );


    ctx.quadraticCurveTo(
        cx - 60,
        cy + 10,
        cx - 60,
        cy - 70
    );


    ctx.closePath();


    ctx.fill();


    /*
    左側把手
    */

    ctx.beginPath();


    ctx.arc(
        cx - 70,
        cy - 45,
        22,
        Math.PI / 2,
        Math.PI * 1.5,
        false
    );


    ctx.arc(
        cx - 70,
        cy - 45,
        10,
        Math.PI * 1.5,
        Math.PI / 2,
        true
    );


    ctx.closePath();


    ctx.fill();


    /*
    右側把手
    */

    ctx.beginPath();


    ctx.arc(
        cx + 70,
        cy - 45,
        22,
        Math.PI / 2,
        Math.PI * 1.5,
        true
    );


    ctx.arc(
        cx + 70,
        cy - 45,
        10,
        Math.PI / 2,
        Math.PI * 1.5,
        false
    );


    ctx.closePath();


    ctx.fill();


    /*
    杯桿
    */

    ctx.fillRect(
        cx - 10,
        cy + 10,
        20,
        25
    );


    /*
    底座
    */

    ctx.fillRect(
        cx - 45,
        cy + 35,
        90,
        18
    );


    /*
    勝利文字
    */

    ctx.fillStyle =
        "#ffffff";


    ctx.font =
        "bold 40px Arial";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        "🏆 勝利",
        cx,
        cy + 90
    );


    ctx.font =
        "18px Arial";


    ctx.fillStyle =
        "#cccccc";


    ctx.fillText(
        "按空間鍵或重新開始",
        cx,
        cy + 122
    );


    ctx.restore();

}


/* ==========================================
   畫遊戲畫面
 ========================================== */

function draw() {

    /*
    背景
    */

    ctx.fillStyle =
        "#101010";


    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    /*
    格線
    */

    ctx.strokeStyle =
        "#222";


    for (
        let i = 0;
        i <= tileCount;
        i++
    ) {

        ctx.beginPath();


        ctx.moveTo(

            i * gridSize,

            0

        );


        ctx.lineTo(

            i * gridSize,

            canvas.height

        );


        ctx.stroke();


        ctx.beginPath();


        ctx.moveTo(

            0,

            i * gridSize

        );


        ctx.lineTo(

            canvas.width,

            i * gridSize

        );


        ctx.stroke();

    }


    /*
    --------------------------------------
    畫食物
    --------------------------------------
    */

    foods.forEach(

        function(food) {

            const centerX =
                food.x *
                gridSize +
                gridSize / 2;


            const centerY =
                food.y *
                gridSize +
                gridSize / 2;


            /*
            普通食物
            */

            if (
                food.type === "normal"
            ) {

                ctx.fillStyle =
                    "#ff5252";


                ctx.beginPath();


                ctx.arc(

                    centerX,

                    centerY,

                    gridSize / 2 - 2,

                    0,

                    Math.PI * 2

                );


                ctx.fill();

            }


            /*
            特殊食物
            */

            if (
                food.type === "special"
            ) {

                ctx.fillStyle =
                    "#ffd700";


                drawStar(

                    centerX,

                    centerY,

                    9,

                    4

                );

            }

        }

    );


    /*
    --------------------------------------
    畫蛇
    --------------------------------------
    */

    snake.forEach(

        function(
            part,
            index
        ) {

            if (
                index === 0
            ) {

                ctx.fillStyle =
                    "#66ff66";

            } else {

                ctx.fillStyle =
                    "#35b935";

            }


            ctx.fillRect(

                part.x *
                    gridSize + 1,

                part.y *
                    gridSize + 1,

                gridSize - 2,

                gridSize - 2

            );

        }

    );

}


/* ==========================================
   畫特殊食物星星
========================================== */

function drawStar(
    cx,
    cy,
    outerRadius,
    innerRadius
) {

    let rotation =
        Math.PI / 2 * 3;


    let x;

    let y;


    const step =
        Math.PI / 5;


    ctx.beginPath();


    ctx.moveTo(
        cx,
        cy - outerRadius
    );


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        x =
            cx +
            Math.cos(rotation) *
            outerRadius;


        y =
            cy +
            Math.sin(rotation) *
            outerRadius;


        ctx.lineTo(
            x,
            y
        );


        rotation += step;


        x =
            cx +
            Math.cos(rotation) *
            innerRadius;


        y =
            cy +
            Math.sin(rotation) *
            innerRadius;


        ctx.lineTo(
            x,
            y
        );


        rotation += step;

    }


    ctx.lineTo(
        cx,
        cy - outerRadius
    );


    ctx.closePath();

    ctx.fill();

}


/* ==========================================
   電腦鍵盤控制
========================================== */

document.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "ArrowUp"
        ) {

            event.preventDefault();

            changeDirection("up");

        }


        else if (
            event.key === "ArrowDown"
        ) {

            event.preventDefault();

            changeDirection("down");

        }


        else if (
            event.key === "ArrowLeft"
        ) {

            event.preventDefault();

            changeDirection("left");

        }


        else if (
            event.key === "ArrowRight"
        ) {

            event.preventDefault();

            changeDirection("right");

        }


        else if (
            event.code === "Space"
        ) {

            event.preventDefault();

            togglePause();

        }


        else if (
            event.code === "Enter"
        ) {

            restartGame();

        }

    }

);
