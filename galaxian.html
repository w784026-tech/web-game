<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<!-- 手機 viewport：必要！沒有的話頁面會被縮放變黑、尺寸異常 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#111" />
<title>小蜜蜂</title>
<!-- 除錯：任何 JS 錯誤直接顯示在畫面上，方便手機排查 -->
<pre id="errbox" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#a00;color:#fff;margin:0;padding:8px;font:13px monospace;white-space:pre-wrap;"></pre>
<script>
window.onerror = function (msg, src, line, col) {
  var b = document.getElementById("errbox");
  if (b) {
    b.style.display = "block";
    b.textContent = "JS 錯誤: " + msg + " (第 " + (line || "?") + " 行, " + (col || "?") + " 欄)";
  }
};
// 指標：JS 一執行就把此標籤變绿，證明除錯腳本已跑
var _ind = document.getElementById("jsok");
if (_ind) _ind.textContent = "JS 已啟動";
</script>
<noscript><p style="color:#fff;text-align:center;">此遊戲需要開啟 JavaScript 才能遊玩，請在瀏覽器設定中允許 JavaScript。</p></noscript>
<style>
  /* 頁面整體樣式：深色背景、內容置中、使用等寬字體 */
  body {
    margin: 0;
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: monospace;
    color: #fff;
  }
  /* 遊戲畫布：黑底、加邊框、置頂間距 */
  canvas {
    background: #000;
    border: 2px solid #444;
    margin-top: 20px;
  }
  /* 畫布下方的操作說明區 */
  #tip {
    margin-top: 10px;
    font-size: 16px;
  }
  /* 控制按鈕列：置中排列、深色按鈕 */
  #controls {
    margin-top: 10px;
  }
  #controls button {
    font-family: monospace;
    font-size: 16px;
    margin: 0 8px;
    padding: 6px 16px;
    background: #333;
    color: #fff;
    border: 1px solid #666;
    border-radius: 4px;
    cursor: pointer;
  }
  #controls button:hover {
    background: #555;
  }
  #controls button#endBtn {
    display: block;
    margin: 20px auto 0 auto;
  }
  /* 手機：遊戲畫面放寬、觸控按鈕顯示 */
  @media (max-width: 600px), (pointer: coarse) {
    body {
      height: 100vh;
      height: 100dvh;
      justify-content: center;
    }
    #tip, #controls { display: none; }
    canvas {
      width: 100%;
      height: auto;              /* 依 canvas 本體比例(4:5)自動對應高度，手機驗證過可用 */
      max-height: 100vh;
      max-height: 100dvh;
      border: none;
      margin: 0;
      display: block;
      touch-action: none;
      background: #000;
    }
    .tbtn {
      position: fixed;
      bottom: 16px;
      z-index: 10;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;                /* 去掉外框，不擋炮台 */
      background: transparent;     /* 底色透明，炮台透出來 */
      color: rgba(255, 255, 255, 0.45);   /* 箭頭淡出，平時幾乎看不見 */
      font-size: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tbtn:active {
      background: rgba(120, 120, 120, 0.5);
      color: #fff;                 /* 按壓時才亮起，確認有觸到 */
    }
    /* 左鍵 100px（最左）／右鍵 92px／射擊鍵 90px */
    #btnTL { left: 42px; width: 100px; height: 100px; font-size: 44px; }
    #btnTR { left: 158px; width: 92px; height: 92px; font-size: 42px; }
    /* 射擊鍵保留輕微底色，讓右手知道這是主要操作區 */
    #btnFire {
      right: 42px;
      width: 90px; height: 90px; font-size: 40px;
      color: rgba(255, 255, 255, 0.6);
      background: rgba(70, 70, 70, 0.35);
    }
  }
</style>
</head>
<body>
<!-- 指紋：JS 是否啟動（若一直顯示「等待 JS…」代表腳本被擋下/沒跑起來） -->
<p id="jsok" style="position:fixed;bottom:2px;left:2px;z-index:99;color:#8f8;font:12px monospace;opacity:.8;"> waiting js... 等待 JS…</p>
<!-- 遊戲畫布：所有遊戲畫面（含抬頭 HUD）都畫在這 480x600 的區域內 -->
<canvas id="game" width="480" height="600"></canvas>
<!-- 操作說明（放在畫布下方，不佔遊戲畫面） -->
<div id="tip">操作: ← → 移動，空白鍵射擊，P 暫停，M 音效開關；Game Over / 破關時按 R 重新開始</div>
<!-- 控制按鈕：暫停 / 繼續，以及重新開始（點擊或按鍵盤 P、R） -->
<div id="controls">
  <button id="pauseBtn">暫停 (P)</button>
  <button id="restartBtn">重新開始 (R)</button>
</div>
<!-- 手機版觸控按鈕：左下 ← → 移動，右下空白處射擊 -->
<div id="touchUI">
  <div class="tbtn" id="btnTL">←</div>
  <div class="tbtn" id="btnTR">→</div>
  <div class="tbtn" id="btnFire">⬆</div>
</div>

<script>
/* ============================================================
   一、基本設定
   ============================================================ */

// 取得畫布和 2D 繪圖上下文（畫筆），後續所有繪製動作都透過 ctx 執行
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
// 畫布的寬度與高度，之後計算邊界都會用到
const W = canvas.width;
const H = canvas.height;

/* ============================================================
   二、玩家（小飛船）
   ============================================================ */

// 玩家物件：x/y 是左上角座標，w/h 是寬高，speed 是每幀移動速度
const player = {
  x: W / 2 - 20,   // 初始放在畫面中央
  y: H - 40,       // 靠近底部
  w: 40,
  h: 20,
   speed: 7         // 每幀移動 7 像素（調快，手機左側空間小也能快速移動）
};

/* ============================================================
   三、子彈
   ============================================================ */

const bullets = [];        // 玩家子彈陣列：每一顆是一個 {x, y, w, h} 物件
const BULLET_SPEED = 8;    // 玩家子彈每幀向上飛 8 像素
let lastShot = 0;          // 上次玩家發射的時間，用來限制射擊頻率

// 敵方（蜜蜂）的反擊子彈
const enemyBullets = [];   // 敵方子彈陣列
const CHARGE_TIME = 400;   // 蜜蜂「蓄力告警」的持續時間（毫秒），蓄力中會發紅光
let chargeBee = null;      // 目前正在蓄力的蜜蜂（發射前提醒玩家）
let chargeStart = 0;       // 這次蓄力開始的時間，用來判斷何時該發射
let btnPause = null;       // HUD 上「暫停按鈕」的矩形位置，供點擊偵測使用
let btnMute = null;        // HUD 上「音效開關按鈕」的矩形位置，供點擊偵測使用
let soundOn = true;        // 音效開關：true=開啟，false=靜音（控制所有聲音）

// 建立 WebAudio 上下文（延遲到首次使用，避免自動播放限制）
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// 爆炸聲：用 WebAudio 合成「低頻隆隆 + 白噪音」的爆炸效果
function playExplosion() {
  if (!soundOn) return;                          // 靜音時不播
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    // 1) 低頻隆隆聲：150Hz → 40Hz 快速下降
    const osc = ctx.createOscillator();
    const oscGain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
    oscGain.gain.setValueAtTime(0.6, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
    osc.connect(oscGain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.5);
    // 2) 白噪音「嘭」聲（前 0.2 秒）
    const dur = 0.25;
    const bufLen = ctx.sampleRate * dur;
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) {
      // 雜訊隨時間衰減
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufLen);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.4, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    // 高通濾波讓噪音更像「爆炸」
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(1000, now);
    filter.frequency.exponentialRampToValueAtTime(100, now + dur);
    noise.connect(filter).connect(noiseGain).connect(ctx.destination);
    noise.start(now);
    noise.stop(now + dur);
  } catch (e) { /* 忽略 WebAudio 建立失敗 */ }
}
// 總靜音切換（背景音樂、俯衝、爆炸、結束曲都跟隨）
function setSound(on) {
  soundOn = on;
  if (on) {
    // 恢復：依目前遊戲狀態把該播的音樂重新播起來
    if (bgmStarted && !gameOver) bgm.play().catch(() => {});
    if (bgmStarted && gameOver) endMusic.play().catch(() => {});
  } else {
    // 靜音：全部暫停（俯衝音效 + 背景音樂 + 結束曲）
    stopDiveSound();
    if (bgmStarted) bgm.pause();
    endMusic.pause();
  }
}

// 音效：俯衝蜂起飛的瞬間播放 dive_sound.wav
// 用多份 Audio 實例輪流播放，避免多隻同時起飛時聲音互相蓋掉
const diveSounds = [new Audio("dive_sound.wav"), new Audio("dive_sound.wav")];
let diveSoundIdx = 0;
function playDiveSound() {
  if (!soundOn) return;    // 靜音時不播
  const a = diveSounds[diveSoundIdx];
  diveSoundIdx = (diveSoundIdx + 1) % diveSounds.length; // 輪流用下一份
  a.currentTime = 0;
  a.play().catch(() => {});   // 若瀏覽器阻止自動播放則靜默忽略
}
// 停止所有俯衝音效（俯衝蜂被擊落、清場時呼叫）
function stopDiveSound() {
  for (const a of diveSounds) {
    a.pause();
    a.currentTime = 0;
  }
}

// 背景音樂：遊戲進行中循環播 High_Score_Panic.mp3；
// 遊戲結束時停掉背景音樂，改播 bee_ambience.mp3（結束曲）
const bgm = new Audio("High_Score_Panic.mp3");
bgm.loop = true;           // 循環播放
bgm.volume = 0.3;          // 音量放小，別蓋過效果音
let bgmStarted = false;    // 是否已啟動（瀏覽器需玩家操作後才能播音）
function startBgm() {
  if (bgmStarted) return;
  bgmStarted = true;
  bgm.play().catch(() => {});
}
// 瀏覽器自動播放限制：先等玩家第一次按下任意鍵/點擊畫布才開播
window.addEventListener("keydown", () => startBgm(), { once: true });
canvas.addEventListener("click", () => startBgm(), { once: true });

function stopBgm() {
  bgm.pause();
}
// 遊戲結束：停背景音樂 → 播結束曲 bee_ambience
const endMusic = new Audio("bee_ambience.mp3");
function playEndMusic() {
  stopBgm();
  if (!soundOn) return;    // 靜音時只停背景音樂、不播結束曲
  endMusic.currentTime = 0;
  endMusic.play().catch(() => {});
}
let endMusicPlayed = false;  // 結束曲是否已播放（避免每幀重複觸發）

// 暫停時連帶暫停背景音樂；恢復時再播
function setPaused(p) {
  paused = p;
  if (p) {
    stopBgm();
  } else if (soundOn && bgmStarted && !gameOver) {
    bgm.play().catch(() => {});
  }
}
// 敵方子彈速度：前三關慢（2px/幀），第 4 關起每關變快
function enemyBulletSpeed() {
  if (level <= 3) return 2;
  return 1 + (level - 3);   // 第 4 關 = 2，第 5 關 = 3，依此類推
}
// 蜜蜂發射間隔：前期很稀疏（2.6 秒），之後每關縮短 400 毫秒，最快 800 毫秒
function enemyShotInterval() {
  return Math.max(800, 2600 - (level - 1) * 400);
}
let lastEnemyShot = 0;     // 上次蜜蜂發射的時間

// 「俯衝」機制：關卡進行中，隨機一隻蜂（可能是蜂王）會衝向炮台
const divers = [];         // 目前俯衝中的蜂（每隻含位置、方向、階段等資訊）
let diveNextAt = 0;        // 下一波俯衝的啟動時間
const DIVE_SPEED = 3;      // 俯衝時每幀移動 3 像素（放慢，方便玩家反應）
const DIVE_WARN = 700;     // 俯衝前的紅光警示時間（毫秒）
// 每波俯衝的數量：第 1 關 1 隻、第 2–4 關 2 隻、第 5 關起 3 隻
function diveCount() {
  if (level <= 1) return 1;
  if (level <= 4) return 2;
  return 3;
}
// 判斷某隻蜂是否正在俯衝
function isDiving(ref) { return divers.some(d => d.ref === ref); }
// 兩個矩形有沒有重疊
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

/* ============================================================
   四、蜜蜂（敵人）
   ============================================================ */

const bees = [];                 // 蜜蜂陣列
const BEE_W = 32;               // 每隻蜜蜂的寬度
const BEE_H = 20;               // 每隻蜜蜂的高度
const BEE_COLS = 8;             // 橫排 8 隻
const BEE_ROWS = 5;             // 縱排 5 排
const BEE_GAP = 40;             // 蜜蜂之間的間距
let queen = null;               // 蜂王：蜂群頂端的 Boss，體型較大、4 點生命、100 分
let beeOffsetX = 0;             // 蜂群整體的 X 偏移（左右移動用）
let beeOffsetY = 0;             // 蜂群整體的 Y 偏移（碰到邊向下掉用）
let beeDir = 1;                 // 蜂群移動方向：1=向右，-1=向左
const BEE_MARGIN = 10;          // 距離牆壁的邊界餘量

// 根據目前關卡算出蜂群每幀的移動步長
function beeStep() {
  // 前三關蜂群固定不動（步速 0），第 4 關起以固定舒適速度左右移動
  if (level <= 3) return 0;
  return 1;
}

// 蜂群每碰到邊就下落的像素（泰山壓頂）：
// 第 4 關 = 3px，第 5 關起每關加快（+0.7px/關），第 10 關約 7px，越來越快壓向玩家
function beeDrop() {
  if (level <= 4) return 3;
  return 3 + (level - 4) * 0.7;
}
// 蜂群持續向下逼近：第 4 關起緩慢、持續地每幀向炮台逼近
// 第 5 關起速度隨關卡慢慢增加，帶來越來越強的壓迫感
function beeSink() {
  if (level < 4) return 0;
  if (level === 4) return 0.05;
  return 0.05 + (level - 4) * 0.03;
}

// 依排數決定蜜蜂配色（排號從「最上面 = 第 5 排」往下數到第 1 排）
// 第 5 排（最上方 1 排）：紫色（高威脅）
// 第 4、3 排（中間 2 排）：天空藍（中級）
// 第 2、1 排（最下方 2 排）：亮綠（低威脅）
function beeColors(row) {
  const displayRow = BEE_ROWS - row;   // 換算：最上面的排 = 第 5 排
  if (displayRow <= 2) {
    return { body: "#5e5", wing: "rgba(180,230,255,0.7)", stripe: "#2a2" };
  }
  if (displayRow <= 4) {
    return { body: "#59f", wing: "rgba(220,240,255,0.7)", stripe: "#25a" };
  }
  return { body: "#c6f", wing: "rgba(245,200,255,0.7)", stripe: "#73a" };
}

// 依排數決定生命值：第 5 排（紫）3 點、第 4、3 排（藍）2 點、第 2、1 排（綠）1 點
function beeHp(bee) {
  const displayRow = BEE_ROWS - bee.row;
  if (displayRow === 5) return 3;
  if (displayRow >= 3 && displayRow <= 4) return 2;
  return 1;
}

// 依排數決定擊殺分數：第 2、1 排（綠）10 分、第 4、3 排（藍）15 分、第 5 排（紫）20 分
function beeScore(bee) {
  const displayRow = BEE_ROWS - bee.row;
  if (displayRow <= 2) return 10;
  if (displayRow <= 4) return 15;
  return 20;
}

// 生成 8x5、水平置中的蜂群，蜂王放在蜂群最頂端正中央
function makeBees() {
  bees.length = 0;              // 先清空陣列
  // 把整群蜜蜂水平置中：算出總寬度後求左上角起點
  const swarmW = (BEE_COLS - 1) * BEE_GAP + BEE_W;
  const startX = Math.round((W - swarmW) / 2);   // 水平置中的起始 X
  for (let r = 0; r < BEE_ROWS; r++) {
    for (let c = 0; c < BEE_COLS; c++) {
      bees.push({
        x: startX + c * BEE_GAP,
        y: 80 + r * 30,         // 每排間隔 30 像素（往下移讓出抬頭 HUD 與蜂王的空間）
        w: BEE_W,
        h: BEE_H,
        row: r,                 // 記錄自己是第幾排，供配色 / 生命 / 難度判定使用
        alive: true,            // 存活狀態，被擊中至生命歸零時設為 false
        hp: 0,                  // 生命值（依排數，下方賦值）
        hitAt: 0                // 最近一次中彈時間（閃白提示用）
      });
      const fresh = bees[bees.length - 1];
      fresh.hp = beeHp(fresh);
    }
  }
  // 蜂王：放在蜂群最頂端正中央（第一排蜜蜂的上方），體型比一般蜜蜂大一倍
  queen = {
    x: W / 2 - 22,              // 水平正中央
    y: 45,                      // 蜂群頂端上方（HUD 之下）
    w: 44,
    h: 30,
    alive: true,
    hp: 4,                      // 蜂王 4 點生命，需擊中 4 次才倒
    hitAt: 0                    // 最近中彈時間（閃白提示用）
  };
}

/* ============================================================
   五、遊戲狀態（分數、關卡、生命）
   ============================================================ */

let score = 0;          // 分數
let level = 1;          // 目前關卡（共 10 關，打完第 10 關即破關）
let lives = 3;          // 生命數（從 3 開始）
let gameOver = false;   // 是否 Game Over（生命歸零）
let levelClear = false; // 是否過關（正在等待確認進入下一關）
let victory = false;    // 是否破關（第 10 關全數擊倒）
let freezeUntil = 0;    // 受擊後的「暫停閃爍」結束時間：在此之前遊戲暫停、玩家閃爍
let paused = false;     // 手動暫停狀態（按 P 或 Esc 切換）
const TOTAL_LEVELS = 10; // 遊戲總關數

// 最高分：用瀏覽器 localStorage 記住歷史最好成績
let highScore = 0;
try { highScore = parseInt(localStorage.getItem("bee_high_score") || "0", 10) || 0; } catch (e) {}
function saveHighScore() {
  if (score > highScore) highScore = score;
  try { localStorage.setItem("bee_high_score", String(highScore)); } catch (e) {}
}
// Game Over / 破關時同步一次最高分（避免每幀寫 localStorage）
function settleScore() {
  if (score > highScore) highScore = score;
  try { localStorage.setItem("bee_high_score", String(highScore)); } catch (e) {}
}

// 「重新開始」：把所有遊戲狀態回復到第 1 關的初始值
function resetGame() {
  score = 0;
  level = 1;
  lives = 3;
  gameOver = false;
  victory = false;
  levelClear = false;
  paused = false;
  freezeUntil = 0;
  // 停結束曲、重新啟動背景音樂（若玩家有靜音則維持靜音）
  endMusic.pause();
  endMusic.currentTime = 0;
  if (bgmStarted && soundOn) bgm.play().catch(() => {});
  resetLevel();
}

// 過關處理：第 10 關打完 → 破關；否則等玩家確認後進入下一關
function handleLevelClear() {
  levelClear = true;
  saveHighScore();
  if (level >= TOTAL_LEVELS) {
    victory = true;          // 10 關全破 → 進入破關畫面
    // 停背景音樂、播結束曲當作「勝利慶典曲」，直到玩家重新開始
    stopBgm();
    if (soundOn) {
      endMusic.currentTime = 0;
      endMusic.play().catch(() => {});
      endMusicPlayed = true; // 避免主迴圈重複觸發
    }
  }
}

// 「重整本關」：清空子彈與蜂群、把蜂群偏移歸零
// 用在：蜜蜂掉到底部但還有命 / 進入下一關
function resetLevel() {
  bullets.length = 0;     // 清掉場上所有玩家子彈
  enemyBullets.length = 0;  // 也清掉敵方子彈
  chargeBee = null;         // 取消進行中的蓄力告警
  chargeStart = 0;
  divers.length = 0;        // 清掉俯衝中的蜂
  stopDiveSound();          // 重整關卡時同時停止俯衝音效
  diveNextAt = Date.now() + 10000; // 重開關卡後，再過 10 秒才開始第一波俯衝
  beeOffsetX = 0;         // 蜂群 X 偏移歸零
  beeOffsetY = 0;         // 蜂群 Y 偏移歸零
  beeDir = 1;             // 方向重置為向右
  makeBees();             // 重新生成一整群新蜜蜂
  levelClear = false;     // 解除「過關等待」狀態
}
resetLevel();             // 遊戲一開始先初始化第 1 關

/* ============================================================
   六、鍵盤輸入
   ============================================================ */

// 用一個物件記住「目前按下滑的鍵」（例如 keys["ArrowLeft"] = true）
const keys = {};
window.addEventListener("keydown", e => {
  // 暫停 / 繼續：按 P 或 Esc 切換（任何時刻都可用；會連帶暫停背景音樂）
    if (e.code === "KeyP" || e.code === "Escape") {
    if (!gameOver && !victory) setPaused(!paused);
    return;
  }
  // 音效開關：按 M 切換（任何時刻都可用），或點 HUD 上的喇叭按鈕
  if (e.code === "KeyM") {
    startBgm();           // 確保 AudioContext 已啟動
    setSound(!soundOn);
    return;
  }
  // 重新開始：按 R 鍵直接回到第 1 關（Game Over / 破關畫面時用）
  if ((gameOver || victory) && e.code === "KeyR") {
    resetGame();
    return;
  }
  // 過關狀態下，按空白鍵 → 進入下一關（破關畫面按 R 重新挑戰）
  if (levelClear && !victory && e.code === "Space") {
    level++;                               // 關卡 +1
    score += 50;                           // 過關獎勵 50 分
    resetLevel();                          // 重新生成新關卡的蜂群（會清除過關狀態）
  }
  keys[e.code] = true;                     // 標記該鍵為按下
  if (e.code === "Space") e.preventDefault(); // 防止空白鍵捲動頁面
});
window.addEventListener("keyup", e => {
  keys[e.code] = false;                    // 標記該鍵為放開
});

// 控制按鈕：與鍵盤 P / R 鍵作用相同
document.getElementById("pauseBtn").addEventListener("click", function () {
  if (!gameOver && !victory) setPaused(!paused);
});
document.getElementById("restartBtn").addEventListener("click", resetGame);

/* ---------- 手機觸控按鈕：← → 移動、右下射擊（長按連續射擊） ---------- */
function bindTouch(id, onDown, onUp) {
  const el = document.getElementById(id);
  el.addEventListener("touchstart", e => {
    e.preventDefault();
    e.stopPropagation();
    startBgm();
    onDown();
  }, { passive: false });
  el.addEventListener("touchend", e => {
    e.preventDefault();
    e.stopPropagation();
    if (onUp) onUp();
  }, { passive: false });
  el.addEventListener("touchcancel", e => {
    e.preventDefault();
    e.stopPropagation();
    if (onUp) onUp();
  }, { passive: false });
  el.addEventListener("mousedown", e => {
    e.preventDefault();
    e.stopPropagation();
    startBgm();
    onDown();
  });
  el.addEventListener("mouseup", e => {
    e.preventDefault();
    e.stopPropagation();
    if (onUp) onUp();
  });
  el.addEventListener("mouseleave", e => {
    if (onUp) onUp();
  });
}
bindTouch("btnTL", () => { keys["ArrowLeft"] = true; }, () => { keys["ArrowLeft"] = false; });
bindTouch("btnTR", () => { keys["ArrowRight"] = true; }, () => { keys["ArrowRight"] = false; });
bindTouch("btnFire", () => { keys["Space"] = true; }, () => { keys["Space"] = false; });

// 畫布內的「暫停按鈕 / 音效按鈕」點擊偵測
function inRect(mx, my, r) {
  return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
}
canvas.addEventListener("click", function (e) {
  // 把瀏覽器座標換算成畫布座標
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width;
  const sy = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * sx;
  const my = (e.clientY - rect.top) * sy;
  startBgm();
  // 音效開關：任何時刻（含暫停中）都可切換
  if (btnMute && inRect(mx, my, btnMute)) {
    setSound(!soundOn);
    return;
  }
  // 暫停/繼續
  if (!gameOver && btnPause && inRect(mx, my, btnPause)) {
    setPaused(!paused);
    return;
  }
  // 結束畫面：點擊畫布 = 重新開始
  if (gameOver || victory) {
    resetGame();
    return;
  }
  // 過關畫面：點擊畫布 = 進入下一關
  if (levelClear) {
    level++;
    score += 50;
    resetLevel();
    return;
  }
  if (paused) return;   // 暫停中不射擊
  // 一般遊玩的點擊 = 單發射擊（手機右手快速點按）
  const nowC = Date.now();
  if (nowC - lastShot > 300) {
    bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 12 });
    lastShot = nowC;
  }
});

/* ============================================================
   七、遊戲邏輯（每幀執行一次的更新）
   ============================================================ */

function update() {
  // 遊戲結束、正在過關、或手動暫停時，停止所有邏輯更新
  if (gameOver || levelClear || paused) return;
  // 受擊保護時間內：遊戲暫停（蜜蜂、子彈全部凍結），只保留畫面閃爍
  if (Date.now() < freezeUntil) return;

  /* ---------- 1. 玩家移動 ---------- */
  // 邊界：允許炮台最大一個身位垂到畫面外，有效加大左右（尤其左側）的移動空間，
  // 手機單手持握時左拇指範圍小，也能把炮台壓到極左位置閃躲
  const PLAYER_MIN = -player.w;
  const PLAYER_MAX = W;
  // 按左鍵就左移，按右鍵就右移
  if (keys["ArrowLeft"]) player.x -= player.speed;
  if (keys["ArrowRight"]) player.x += player.speed;
  player.x = Math.max(PLAYER_MIN, Math.min(PLAYER_MAX, player.x));

  /* ---------- 2. 射擊 ---------- */
  const now = Date.now();   // 目前時間（毫秒）
  // 按住空白鍵且距離上次發射超過 300 毫秒 → 發射一顆子彈
  if (keys["Space"] && now - lastShot > 300) {
    // 子彈發射位置：玩家正上方中央
    bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 12 });
    lastShot = now;         // 記錄本次發射時間
  }

  /* ---------- 3. 子彈移動 ---------- */
  // 倒數迴圈是為了安全地從陣列中刪除已出界的子彈
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y -= BULLET_SPEED;            // 向上飛
    if (bullets[i].y + bullets[i].h < 0) {   // 飛出畫面頂端
      bullets.splice(i, 1);                  // 從陣列移除
    }
  }

  /* ---------- 3.5 敵方子彈移動 ---------- */
  const eSpeed = enemyBulletSpeed();    // 本關的敵方子彈速度
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    enemyBullets[i].y += eSpeed;        // 向下飛
    if (enemyBullets[i].y > H) {        // 飛出畫面底端
      enemyBullets.splice(i, 1);        // 從陣列移除
    }
  }

  /* ---------- 4. 蜂群整體移動 ---------- */
  const step = beeStep();                    // 本關的步長（關卡越高越快）
  // 先計算「活著」的蜂群最左、最右的范围（加上整體偏移）
  let minX = Infinity, maxX = -Infinity;
  for (const b of bees) {
    if (!b.alive) continue;                  // 跳過已被擊中的蜜蜂
    minX = Math.min(minX, b.x + beeOffsetX);
    maxX = Math.max(maxX, b.x + beeOffsetX + b.w);
  }
  // 蜂王也算進蜂群範圍，讓蜂群移動時不會把蜂王甩出去
  if (queen && queen.alive) {
    minX = Math.min(minX, queen.x + beeOffsetX);
    maxX = Math.max(maxX, queen.x + beeOffsetX + queen.w);
  }
  if (minX !== Infinity) {                   // 只要還有活著的蜜蜂
    // 碰到右邊 → 轉向向左
    if (beeDir === 1 && maxX + step > W - BEE_MARGIN) beeDir = -1;
    // 碰到左邊 → 轉向向右
    if (beeDir === -1 && minX - step < BEE_MARGIN) beeDir = 1;
    // 按目前方向移動
    beeOffsetX += beeDir * step;
    // 剛才是「碰右邊轉向」的情況 → 同時向下掉
    if (beeDir === 1 && maxX + step >= W - BEE_MARGIN) beeOffsetY += beeDrop();
    // 剛才是「碰左邊轉向」的情況 → 同時向下掉
    if (beeDir === -1 && minX - step <= BEE_MARGIN) beeOffsetY += beeDrop();
  }
  // 第 4 關起蜂群「持續、緩慢地」向炮台推進（泰山壓頂），5 關起推進速度再加快
  beeOffsetY += beeSink();

  /* ---------- 4.5 俯衝：挑出本波的俯衝蜂 ---------- */
  const nowD = Date.now();
  // 波次條件：時間到了、場上没有俯衝中的蜂
  if (nowD >= diveNextAt && divers.length === 0) {
    const candidates = bees.filter(b => b.alive && !isDiving(b)); // 排除已被擊中/俯衝中的
    // 蜂王也可俯衝（Boss 衝鋒），以虛擬物件形式加入候選
    if (queen && queen.alive && !isDiving(queen)) {
      candidates.push(queen);
    }
    const count = Math.min(diveCount(), candidates.length);       // 本波數量（依關卡）
    // 起飛間隔：第 1 關同時；第 2 關起每隻錯開 800ms，不會一起撲下
    const stagger = (level <= 1) ? 0 : 800;
    for (let k = 0; k < count; k++) {
      const idx = Math.floor(Math.random() * candidates.length);
      const pick = candidates.splice(idx, 1)[0];                  // 隨機抽一隻
      const isQueen = (pick === queen);                            // 是否為蜂王
      divers.push({
        ref: pick,                            // 被選中的蜂（供繪製與碰撞判定用）
        x: pick.x + beeOffsetX,               // 俯衝時的實際座標（脫離蜂群偏移）
        y: pick.y + beeOffsetY,
        w: pick.w,
        h: pick.h,
        row: isQueen ? -1 : pick.row,         // -1 = 蜂王（繪製時用金色配色）
        dx: 0,                                // 每幀 X 位移（起飛時才計算朝向）
        dy: 0,                                // 每幀 Y 位移
        launching: false,                     // 是否已起飛（起飛前懸停警示）
        warnUntil: nowD + DIVE_WARN + k * stagger // 各蜂錯開起飛時間
      });
    }
    diveNextAt = nowD + 8000 + (count - 1) * stagger; // 本波結束（最後一隻起飛）再 +8 秒冷卻
  }

  /* ---------- 4.6 俯衝蜂移動（警示 → 各別起飛 → 俯衝 → 飛回原位） ---------- */
  for (let i = divers.length - 1; i >= 0; i--) {
    const d = divers[i];
    if (nowD < d.warnUntil) continue;   // 警示期間懸停不動（閃紅提醒）
    if (!d.launching) {
      d.launching = true;
      playDiveSound();   // 俯衝蜂起飛的瞬間播放音效
      const tx = player.x + player.w / 2;
      const ty = player.y + player.h / 2;
      const len = Math.hypot(tx - (d.x + d.w / 2), ty - (d.y + d.h / 2)) || 1;
      d.dx = (tx - d.x - d.w / 2) / len * DIVE_SPEED;   // 每幀 X 位移（此刻才計算，方向更新鮮）
      d.dy = (ty - d.y - d.h / 2) / len * DIVE_SPEED;   // 每幀 Y 位移
    }

    if (!d.returning) {
      // 階段一：俯衝撲向炮台
      d.x += d.dx;
      d.y += d.dy;
      // 擦身而過（已越過炮台）或飞出畫面 → 進入「飛回」階段
      if (d.y > player.y + player.h || d.y + d.h < -40 ||
          d.y > H + 40 || d.x < -40 || d.x > W + 40) {
        d.returning = true;
      }
      // 撞到炮台（已扣命過，d.hit 為真）也轉為飛回
      if (d.hit) d.returning = true;
    }

    if (d.returning) {
      // 階段二：以與俯衝「相同速度」直線飛回原位
      // 目標 = 该蜂在蜂群中的位置（base 座標 + 目前蜂群偏移，會跟隨蜂群移動）
      const tx = d.ref.x + beeOffsetX;
      const ty = d.ref.y + beeOffsetY;
      const dist = Math.hypot(tx - d.x, ty - d.y) || 1;
      // 每幀朝目標移動 DIVE_SPEED 像素；超過距離時直接落點，避免振盪
      const stepBack = Math.min(DIVE_SPEED, dist);
      d.x += (tx - d.x) / dist * stepBack;
      d.y += (ty - d.y) / dist * stepBack;
      // 飛到原位附近 → 移除（該蜂 alive 仍為真，之後重新隨蜂群移動）
      if (Math.abs(d.x - tx) < 3 && Math.abs(d.y - ty) < 3) {
        divers.splice(i, 1);
      }
    }
  }


  /* ---------- 4.7 蜜蜂反擊射擊（先蓄力告警、再射擊） ---------- */
  const nowE = Date.now();

  // 階段一：挑一隻蜜蜂（或蜂王）開始蓄力（蓄力中該隻蜂會閃紅光，玩家看得懂是誰要射）
  if (!chargeBee && nowE - lastEnemyShot > enemyShotInterval()) {
    const shooters = bees.filter(b => b.alive);   // 候選發射者：活著的蜜蜂
    if (queen && queen.alive) shooters.push(queen); // 蜂王也會開槍
    if (shooters.length > 0) {
      chargeBee = shooters[Math.floor(Math.random() * shooters.length)];
      chargeStart = nowE;
    }
  }

  // 蓄力的蜜蜂若已被擊中 → 取消蓄力，不浪费
  if (chargeBee && !chargeBee.alive) chargeBee = null;

  // 階段二：蓄力時間到 → 真正發射子彈（發射前再次確認該蜂仍存活，避免「幽靈子彈」）
  if (chargeBee && chargeBee.alive && nowE - chargeStart >= CHARGE_TIME) {
    const sx = chargeBee.x + beeOffsetX + chargeBee.w / 2 - 2;   // 從蜜蜂底部中央發射
    const sy = chargeBee.y + beeOffsetY + chargeBee.h;
    enemyBullets.push({ x: sx, y: sy, w: 4, h: 12 });
    lastEnemyShot = nowE;                 // 記錄本次發射時間，控制下次間隔
    chargeBee = null;                     // 清除蓄力狀態
  }

  /* ---------- 5. 蜜蜂或蜂王掉到底部 → 扣一條命 ---------- */
  let reachedBottom = false;
  for (const b of bees) {
    // 任一隻活著的蜜蜂底部 >= 玩家頂部 → 本次守衛失敗
    if (b.alive && b.y + beeOffsetY + b.h >= player.y) reachedBottom = true;
  }
  // 蜂王掉到底也算
  if (queen && queen.alive && queen.y + beeOffsetY + queen.h >= player.y) {
    reachedBottom = true;
  }
  // 俯衝中的蜂真的「撞上」炮台 → 該蜂回到原位，玩家扣 1 命後繼續原關卡
  for (const d of divers) {
    if (d.hit || d.returning) continue;     // 已撞過或正在飛回的不再重複計算
    if (d.ref.alive && overlap(d, player)) {
      d.hit = true;                             // 標記此蜂本波已撞過，避免每幀重複扣命
      playExplosion();                          // 撞擊炮台的爆炸聲
      lives--;                                  // 生命 -1
      if (lives <= 0) {
        gameOver = true;                        // 沒命了 → Game Over
      } else {
        freezeUntil = Date.now() + 3000;        // 3 秒保護後繼續原關卡（不重置蜂群）
      }
      break;
    }
  }
  if (reachedBottom) {
    lives--;                                // 生命 -1
    if (lives <= 0) {
      gameOver = true;                      // 蜂群壓到炮台、又沒命了 → Game Over
      settleScore();                        // 同步最高分紀錄
    } else {
      resetLevel();                         // 還有命 → 重整本關再戰
    }
  }

  /* ---------- 6. 碰撞判定：子彈 vs 蜜蜂 ---------- */
  // 倒數迴圈：方便在迴圈中刪除被子彈擊中的子彈
  for (let i = bullets.length - 1; i >= 0; i--) {
    const s = bullets[i];
    for (const b of bees) {
      if (!b.alive) continue;                 // 只檢查活著的蜜蜂
      // 蜜蜂的實際位置 = 原始座標 + 蜂群整體偏移
      const bx = b.x + beeOffsetX;
      const by = b.y + beeOffsetY;
      // 矩形碰撞判定：兩個矩形有沒有重疊的部分
      if (s.x < bx + b.w && s.x + s.w > bx &&
          s.y < by + b.h && s.y + s.h > by) {
        b.hp--;                 // 扣 1 點生命（多血蜜蜂需連續擊中才死）
        b.hitAt = Date.now();   // 記錄中彈時間（閃白提示）
        bullets.splice(i, 1);   // 子彈消耗掉
        if (b.hp <= 0) {
          b.alive = false;      // 生命歸零 → 擊落
          score += beeScore(b); // 依排數給分（顏色越深分數越高）
        }
        break;                  // 這顆子彈已經撞上了，不用再檢查其他蜜蜂
      }
    }
  }

  /* ---------- 6.1 碰撞判定：子彈 vs 俯衝蜂 ---------- */
  // 俯衝蜂維持俯衝狀態接受攻擊，打滿剩餘生命才被擊落（中途不飛回）；
  // 普通蜂擊落 +30 分、蜂王擊倒 +100 分
  for (let i = divers.length - 1; i >= 0; i--) {
    const d = divers[i];
    for (let j = bullets.length - 1; j >= 0; j--) {
      const s = bullets[j];
      if (overlap(s, d)) {
        bullets.splice(j, 1);
        if (d.ref === queen) {
          // 蜂王俯衝中被打：扣 1 點血、繼續俯衝，4 發打完才倒下
          queen.hp--;
          queen.hitAt = Date.now();   // 閃白提示中彈
          if (queen.hp <= 0) {
            queen.alive = false;
            score += 100;             // Boss 擊倒 +100 分
            stopDiveSound();          // 蜂王被擊倒 → 俯衝音效立即結束
            divers.splice(i, 1);      // 已擊落 → 移出俯衝陣列
          }
          saveHighScore();            // 即時同步最高分
        } else {
          // 普通蜂俯衝中：扣 1 點血、繼續俯衝，生命歸零才擊落（+30 分）
          d.ref.hp--;
          d.ref.hitAt = Date.now();
          if (d.ref.hp <= 0) {
            d.ref.alive = false;
            score += 30;
            stopDiveSound();          // 俯衝蜂被擊落 → 俯衝音效立即結束
            divers.splice(i, 1);      // 已擊落 → 移出俯衝陣列
          }
        }
        break;
      }
    }
  }

  /* ---------- 6.2 碰撞判定：子彈 vs 蜂王 ---------- */
  if (queen && queen.alive) {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const s = bullets[i];
      const qx = queen.x + beeOffsetX;    // 蜂王實際位置 = 原始位置 + 蜂群偏移
      const qy = queen.y + beeOffsetY;
      if (s.x < qx + queen.w && s.x + s.w > qx &&
          s.y < qy + queen.h && s.y + s.h > qy) {
        // 蜂王有 4 點生命：要打 4 次才倒；擊倒時一次計 100 分
        bullets.splice(i, 1);    // 子彈消耗掉
        queen.hp--;
        queen.hitAt = Date.now();      // 記錄中彈時間（繪製時閃白提示）
        if (queen.hp <= 0) {
          queen.alive = false;         // 生命歸零 → 蜂王倒下
          score += 100;                // Boss 擊倒 +100 分
          saveHighScore();             // 即時同步最高分
        }
        break;
      }
    }
  }

  /* ---------- 6.5 碰撞判定：敵方子彈 vs 玩家 ---------- */
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const s = enemyBullets[i];
    // 子彈有沒有碰到玩家的矩形
    if (s.x < player.x + player.w && s.x + s.w > player.x &&
        s.y < player.y + player.h && s.y + s.h > player.y) {
      enemyBullets.splice(i, 1);   // 移除這顆擊中玩家的敵方子彈
      playExplosion();             // 撞擊爆炸聲
      lives--;                     // 玩家中彈，生命 -1
      if (lives <= 0) {
        gameOver = true;           // 沒命了 → Game Over
        settleScore();             // 同步最高分紀錄
      } else {
        // 還有命：進入 3 秒「閃爍保護時間」，期間遊戲暫停，
        // 時間到後以目前進度（殘存蜜蜂）繼續本關
        freezeUntil = Date.now() + 3000;
      }
      break;
    }
  }

  /* ---------- 7. 勝利判定：所有蜜蜂和蜂王都被打光 ---------- */
  if (bees.every(b => !b.alive) && (!queen || !queen.alive)) {
    handleLevelClear();         // 過關（若為第 10 關則轉為破關畫面）
  }
}

/* ============================================================
   八、繪製畫面（每幀重畫一次）
   ============================================================ */

// 繪製「單隻蜜蜂」的共用函式（蜂群與俯衝蜂都用它；red=紅光警示）
function drawBeeAt(x, y, w, h, colors, red) {
  const bodyColor = red ? "#f33" : colors.body;
  const wingColor = red ? "rgba(255,100,100,0.7)" : colors.wing;
  ctx.fillStyle = wingColor;
  ctx.beginPath();
  ctx.ellipse(x + w * 0.30, y + h * 0.20, w * 0.26, h * 0.28, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + w * 0.70, y + h * 0.20, w * 0.26, h * 0.28, 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.ellipse(x + w / 2, y + h * 0.60, w * 0.42, h * 0.32, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = red ? "#a22" : colors.stripe;
  ctx.lineWidth = 1.5;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(x + w * (0.5 + i * 0.18) - 2, y + h * 0.35);
    ctx.lineTo(x + w * (0.5 + i * 0.18) + 2, y + h * 0.85);
    ctx.stroke();
  }
  ctx.fillStyle = "#111";
  ctx.beginPath(); ctx.arc(x + w * 0.35, y + h * 0.55, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w * 0.65, y + h * 0.55, 2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = bodyColor;
  for (let f = 0; f < 3; f++) {
    ctx.beginPath();
    ctx.moveTo(x + w * (0.28 + f * 0.22), y + h * 0.85);
    ctx.lineTo(x + w * (0.20 + f * 0.24), y + h);
    ctx.stroke();
  }
}

// 繪製蜂群中的蜜蜂 + 蜂王（俯衝中的蜂改在俯衝位置繪製）
function drawBees() {
  for (const b of bees) {
    if (!b.alive || isDiving(b)) continue;  // 被擊中的、俯衝中的都在別處處理
    const x = b.x + beeOffsetX;   // 實際位置 = 原始位置 + 偏移
    const y = b.y + beeOffsetY;
    // 正在蓄力準備發射的蜜蜂：閃紅警示
    const red = (b === chargeBee) && (Math.floor(Date.now() / 100) % 2 === 0);
    let colors = beeColors(b.row);
    // 中彈閃白：多血蜜蜂被擊中但還沒死時，0.15 秒內整隻閃白，增加打擊回饋
    if (b.hitAt && Date.now() - b.hitAt < 150 && b.hp > 0) {
      colors = { body: "#fff", wing: "rgba(255,255,255,0.9)", stripe: "#ddd" };
    }
    drawBeeAt(x, y, b.w, b.h, colors, red);
  }

  /* ---------- 繪製蜂王（蜂群頂端的 Boss；俯衝中的蜂王改在俯衝位置畫） ---------- */
  if (queen && queen.alive && !isDiving(queen)) {
    const x = queen.x + beeOffsetX;
    const y = queen.y + beeOffsetY;
    const isCharging = (queen === chargeBee);
    const blinking = isCharging && Math.floor(Date.now() / 100) % 2 === 0;
    // 中彈閃白：最近 0.15 秒內中彈 → 整隻閃白，讓玩家清楚知道蜂王被擊中
    const hitFlash = queen.hitAt && (Date.now() - queen.hitAt < 150);
    const bodyColor = hitFlash ? "#fff" : ((isCharging && blinking) ? "#f33" : "#fa3");
    const wingColor = hitFlash ? "rgba(255,255,255,0.9)" : ((isCharging && blinking) ? "rgba(255,100,100,0.7)" : "rgba(255,230,150,0.7)");
    const crownColor = hitFlash ? "#fff" : ((isCharging && blinking) ? "#f44" : "#fd0");

    // 翅膀（更大、淡金色）
    ctx.fillStyle = wingColor;
    ctx.beginPath();
    ctx.ellipse(x + queen.w * 0.32, y - 1, queen.w * 0.26, queen.h * 0.18, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + queen.w * 0.68, y - 1, queen.w * 0.26, queen.h * 0.18, 0.4, 0, Math.PI * 2);
    ctx.fill();

    // 身體（琥珀色大橢圓）
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.ellipse(x + queen.w / 2, y + queen.h * 0.62, queen.w * 0.45, queen.h * 0.36, 0, 0, Math.PI * 2);
    ctx.fill();

    // 深色條紋
    ctx.strokeStyle = "#c72";
    ctx.lineWidth = 2;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(x + queen.w * (0.5 + i * 0.18) - 3, y + queen.h * 0.35);
      ctx.lineTo(x + queen.w * (0.5 + i * 0.18) + 3, y + queen.h * 0.90);
      ctx.stroke();
    }

    // 皇冠（三個尖角的折線形，畫在身體頂端）
    ctx.fillStyle = crownColor;
    ctx.beginPath();
    ctx.moveTo(x + queen.w * 0.34, y + queen.h * 0.32);
    ctx.lineTo(x + queen.w * 0.34, y + queen.h * 0.10);
    ctx.lineTo(x + queen.w * 0.48, y + queen.h * 0.28);
    ctx.lineTo(x + queen.w * 0.50, y);
    ctx.lineTo(x + queen.w * 0.52, y + queen.h * 0.28);
    ctx.lineTo(x + queen.w * 0.66, y + queen.h * 0.10);
    ctx.lineTo(x + queen.w * 0.66, y + queen.h * 0.32);
    ctx.closePath();
    ctx.fill();

    // 觸角（兩根細線向外上方伸出）
    ctx.strokeStyle = crownColor;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x + queen.w * 0.38, y + queen.h * 0.30); ctx.lineTo(x + queen.w * 0.30, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + queen.w * 0.62, y + queen.h * 0.30); ctx.lineTo(x + queen.w * 0.70, y); ctx.stroke();

    // 眼睛（黑底 + 紅瞳，辨識 Boss 身份）
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.arc(x + queen.w * 0.40, y + queen.h * 0.58, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + queen.w * 0.60, y + queen.h * 0.58, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f44";
    ctx.beginPath(); ctx.arc(x + queen.w * 0.40, y + queen.h * 0.58, 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + queen.w * 0.60, y + queen.h * 0.58, 1.3, 0, Math.PI * 2); ctx.fill();
  }
}

// 繪製畫布上方的抬頭 HUD：分數（左）、關卡（中）、生命（右）
function drawHUD() {
  ctx.fillStyle = "#fff";              // 白色文字
  ctx.font = "20px monospace";

  /* ---------- 🔊 音量圖示按鈕（左上角，點擊切換所有聲音） ---------- */
  const muteW = 34;                                  // 固定寬度的小方塊按鈕
  btnMute = { x: 8, y: 6, w: muteW, h: 24 };        // 記錄位置供點擊偵測
  ctx.fillStyle = soundOn ? "#333" : "#551010";      // 靜音時底色偏紅
  ctx.fillRect(btnMute.x, btnMute.y, muteW, 24);
  ctx.strokeStyle = "#666";
  ctx.strokeRect(btnMute.x, btnMute.y, muteW, 24);
  // 喇叭造型：三角 + 圓弧波（靜音時畫斜線）
  const mx = btnMute.x, my = btnMute.y - 4;
  ctx.save();
  ctx.translate(mx + 7, my + 13);
  ctx.fillStyle = "#fff";
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 1.2;
  ctx.beginPath();            // 喇叭本體
  ctx.moveTo(0, -2.5); ctx.lineTo(3, -2.5); ctx.lineTo(6, -5);
  ctx.lineTo(6, 5); ctx.lineTo(3, 2.5); ctx.lineTo(0, 2.5);
  ctx.closePath(); ctx.fill();
  if (soundOn) {              // 開啟時有波浪
    ctx.beginPath(); ctx.arc(7, 0, 3, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(7, 0, 5.5, -0.9, 0.9); ctx.stroke();
  } else {                    // 靜音時畫斜線
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(-1, -6); ctx.lineTo(12, 6); ctx.stroke();
  }
  ctx.restore();

  /* ---------- 分數 + 最高分：畫在喇叭右側 ---------- */
  ctx.fillStyle = "#fff";
  ctx.font = "20px monospace";
  ctx.textAlign = "left";
  ctx.fillText("分數 " + score, 12 + muteW + 8, 22);
  ctx.fillStyle = "#fc6";     // 最高分用金色，一眼可辨
  ctx.font = "13px monospace";
  ctx.fillText("最高 " + highScore, 12 + muteW + 8, 40);

  // 關卡：畫在正中央
  ctx.fillStyle = "#fff";
  ctx.font = "20px monospace";
  ctx.textAlign = "center";
  ctx.fillText("關卡 " + level, W / 2, 26);

  // 生命：畫在右上角，用紅心圖示顯示剩餘數量
  ctx.textAlign = "right";
  const hearts = lives > 0 ? "♥".repeat(lives) : "—";
  const livesText = hearts;

  // ⏸️ 暫停圖示按鈕：右上角最外側，是一個可點擊的方塊按鈕
  const pauseW = 34; // 同樣 34px 方塊
  btnPause = {                                             // 記錄按鈕位置，供點擊偵測使用
    x: W - 8 - pauseW,
    y: 6,
    w: pauseW,
    h: 24
  };
  // 按鈕底色：已暫停時用亮青色表示「目前暫停中」
  ctx.fillStyle = paused ? "#0cf" : "#333";
  ctx.fillRect(btnPause.x, btnPause.y, btnPause.w, btnPause.h);
  ctx.strokeStyle = "#666";
  ctx.strokeRect(btnPause.x, btnPause.y, btnPause.w, btnPause.h);
  // 暫停 / 播放 圖示
  const px = btnPause.x + btnPause.w / 2;
  const py = btnPause.y + btnPause.h / 2;
  ctx.fillStyle = paused ? "#000" : "#fff";
  if (paused) {   // 播放三角形（表示「點擊繼續」）
    ctx.beginPath();
    ctx.moveTo(px - 4, py - 6);
    ctx.lineTo(px + 7, py);
    ctx.lineTo(px - 4, py + 6);
    ctx.closePath();
    ctx.fill();
  } else {        // 兩條暫停直線
    ctx.fillRect(px - 6, py - 6, 4, 12);
    ctx.fillRect(px + 2, py - 6, 4, 12);
  }
  // 生命：畫在暫停按鈕的左邊（紅心）
  ctx.font = "20px monospace";
  ctx.textAlign = "right";
  ctx.fillStyle = "#f66";
  ctx.fillText(livesText, btnPause.x - 10, 26);
}

// 繪製結算 / 過關 / 破關 的提示畫面
function drawEndScreen() {
  // 半透明黑幕蓋住遊戲畫面，讓結算文字清楚可讀
  ctx.fillStyle = "rgba(0, 0, 0, 0.68)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";

  if (victory) {
    // 破關：金色大字（恭喜破關）
    ctx.fillStyle = "#fd3";
    ctx.font = "44px monospace";
    ctx.fillText("恭喜破關！", W / 2, H / 2 - 50);
    ctx.fillStyle = "#fff";
    ctx.font = "20px monospace";
    ctx.fillText("10 關全數擊倒！你是真正的小蜜蜂克星", W / 2, H / 2 - 10);
    ctx.fillText("總分 " + score + "　最高分 " + highScore, W / 2, H / 2 + 25);
    ctx.fillStyle = "#8f8";
    ctx.fillText("按 R 或點擊畫面，再挑戰一次", W / 2, H / 2 + 60);
    // 簡易慶祝：金色閃光粒
    const t = Date.now() / 1000;
    for (let i = 0; i < 18; i++) {
      const a = t * 1.2 + i * 0.35;
      ctx.fillStyle = i % 2 ? "#fd3" : "#7f7";
      ctx.fillRect(W / 2 + Math.cos(a) * (120 + i * 4), H / 2 - 30 + Math.sin(a) * (70 + i * 2), 4, 4);
    }
  } else if (gameOver) {
    // Game Over：紅色大字 + 最終分數 + 重新開始提示（按畫面按鈕或按 R）
    ctx.fillStyle = "#f44";
    ctx.font = "40px monospace";
    ctx.fillText("Game Over", W / 2, H / 2 - 40);
    ctx.fillStyle = "#fff";
    ctx.font = "20px monospace";
    ctx.fillText("最終分數 " + score, W / 2, H / 2);
    ctx.fillStyle = "#fc6";
    ctx.fillText("最高分 " + highScore, W / 2, H / 2 + 28);
    ctx.fillStyle = "#fff";
    ctx.fillText("按 R / 點擊畫面重新開始", W / 2, H / 2 + 55);
  } else if (levelClear) {
    // 過關：綠色大字 + 提示按空白鍵進入下一關
    ctx.fillStyle = "#4f4";
    ctx.font = "40px monospace";
    ctx.fillText("過關！", W / 2, H / 2 - 20);
    ctx.fillStyle = "#fff";
    ctx.font = "20px monospace";
    ctx.fillText("按空白鍵 / 點擊畫面進入第 " + (level + 1) + " 關", W / 2, H / 2 + 20);
  }
}

// 主繪製函式
function draw() {
  // 先整片塗黑，當做「清屏」，把上一幀的畫面蓋掉
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  /* ---------- 畫布上方的抬頭 HUD ---------- */
  drawHUD();

  // 畫蜜蜂
  drawBees();

  // 畫俯衝中的蜂（脫離蜂群、正在衝向炮台）
  for (const d of divers) {
    // 警示期間（還未起飛）→ 紅光閃爍；起飛後 → 正常配色
    const red = (Date.now() < d.warnUntil) && (Math.floor(Date.now() / 100) % 2 === 0);
    // 蜂王俯衝時沿用蜂王配色（金色），普通蜂依排數配色
    let colors = (d.row === -1)
      ? { body: "#fa3", wing: "rgba(255,230,150,0.7)", stripe: "#c72" }
      : beeColors(d.row);
    // 中彈閃白：俯衝中被擊中但還沒擊落時閃白，讓玩家清楚看到命中
    const ref = d.ref;
    if (ref && ref.hitAt && Date.now() - ref.hitAt < 150 && ref.alive) {
      colors = { body: "#fff", wing: "rgba(255,255,255,0.9)", stripe: "#ddd" };
    }
    drawBeeAt(d.x, d.y, d.w, d.h, colors, red);
    // 俯衝中加一道「軌道痕跡」讓玩家看清它的方向
    ctx.strokeStyle = "rgba(255, 80, 80, 0.5)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(d.x + d.w / 2, d.y + d.h);
    ctx.lineTo(d.x + d.w / 2 - d.dx * 6, d.y + d.h - d.dy * 6);
    ctx.stroke();
  }

  // 畫玩家子彈（黃色長方形）
  ctx.fillStyle = "#ff0";
  for (const s of bullets) ctx.fillRect(s.x, s.y, s.w, s.h);

  // 畫敵方子彈（紅色長方形）
  ctx.fillStyle = "#f44";
  for (const s of enemyBullets) ctx.fillRect(s.x, s.y, s.w, s.h);

  /* ---------- 畫玩家炮台（受擊保護期間會閃爍） ---------- */
  const inFreeze = Date.now() < freezeUntil;
  // 閃爍效果：保護期間內每 150ms 交替顯示/消失
  const visible = !inFreeze || (Math.floor(Date.now() / 150) % 2 === 0);
  if (visible) {
    const p = player;
    const cx = p.x + p.w / 2;      // 炮台中心 X
    const bodyColor = inFreeze ? "#8ff" : "#0cf"; // 保護期間亮一點

    // 雙引擎（橘色光，畫在最底層）
    ctx.fillStyle = "rgba(255, 140, 0, 0.9)";
    ctx.beginPath(); ctx.ellipse(cx - p.w * 0.30, p.y + p.h * 0.95, p.w * 0.12, p.h * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + p.w * 0.30, p.y + p.h * 0.95, p.w * 0.12, p.h * 0.22, 0, 0, Math.PI * 2); ctx.fill();

    // 船身（流線型橢圓）
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.ellipse(cx, p.y + p.h * 0.72, p.w * 0.55, p.h * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    // 高光邊線
    ctx.strokeStyle = "#8ff";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 砲座（圓頂，畫在船身頂端）
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.ellipse(cx, p.y + p.h * 0.55, p.w * 0.24, p.h * 0.30, 0, Math.PI, 0);
    ctx.fill();

    // 座艙玻璃（小圓）
    ctx.fillStyle = "#bfe";
    ctx.beginPath();
    ctx.arc(cx, p.y + p.h * 0.45, Math.max(3, p.w * 0.10), 0, Math.PI * 2);
    ctx.fill();

    // 砲管（中央細長方）
    ctx.fillStyle = "#058";
    ctx.fillRect(cx - 2, p.y - p.h * 0.20, 4, p.h * 0.30);
    // 砲口（亮色小方）
    ctx.fillStyle = "#8ff";
    ctx.fillRect(cx - 3, p.y - p.h * 0.20, 6, 3);
  }

  // 如果有結束 / 過關畫面，畫在最上層（保護、暫停都改用 HUD 或閃爍顯示）
  if (gameOver || levelClear) drawEndScreen();
}

/* ============================================================
   九、遊戲主迴圈
   ============================================================ */

// 每幀（約每秒 60 幀）做兩件事：更新邏輯 → 重新繪製
function loop() {
  // 偵測 Game Over 的瞬間 → 播結束曲（只播一次）
  if (gameOver && !endMusicPlayed) {
    endMusicPlayed = true;
    playEndMusic();
  }
  // 重新開始時重置結束曲狀態
  if (!gameOver) endMusicPlayed = false;

  update();
